# Mod metadata for NeoForge. The placeholders are filled from gradle.properties by the generateModMetadata task.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/vasiliy-mikhailov/minecraft-colossus/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/vasiliy-mikhailov/minecraft-colossus"
authors="Vasiliy Mikhailov"
credits="Model, texture, animation and code generated with Claude agents in Claude Code"
description='''A walking armoured stone knight (the Colossus) that approaches the nearest player.'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
